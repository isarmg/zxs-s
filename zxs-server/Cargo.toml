[package]
name = "zxs"
version = "0.1.10"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
unicode-normalization = "0.1"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
blake3 = { version = "1.8", features = ["rayon"] }
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
futures-core = { version = "0.3", default-features = false }
rayon = "1.10"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
zeroize = "1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
