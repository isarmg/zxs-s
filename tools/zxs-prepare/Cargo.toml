[package]
name = "zxs-prepare"
version = "0.1.3"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
unicode-normalization = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
