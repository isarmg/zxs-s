name: Build ZXS release assets
on:
  push:
    tags: ["v[0-9]*", "client-v[0-9]*", "prepare-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'prepare-v')
    uses: ./.github/workflows/ci.yml
    secrets:
      ZXS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZXS_ANDROID_KEYSTORE_BASE64 }}
      ZXS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZXS_ANDROID_KEYSTORE_PASSWORD }}
      ZXS_ANDROID_KEY_ALIAS: ${{ secrets.ZXS_ANDROID_KEY_ALIAS }}
      ZXS_ANDROID_KEY_PASSWORD: ${{ secrets.ZXS_ANDROID_KEY_PASSWORD }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            server: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            server: false
          - os: macos-15
            target: aarch64-apple-darwin
            server: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust for the release target
        run: |
          rustc --version
          rustup target add ${{ matrix.target }}
      - name: Check Rust when the full verification job is skipped
        if: github.ref_type != 'tag' || startsWith(github.ref_name, 'prepare-v')
        run: |
          projects=(zxs-client)
          if [[ "$GITHUB_REF_NAME" == prepare-v* ]]; then
            projects=(tools/zxs-prepare)
          elif [[ "${{ matrix.server }}" == true && "$GITHUB_REF_NAME" != client-v* ]]; then
            projects+=(zxs-server tools/zxs-prepare)
          fi
          for project in "${projects[@]}"; do
            (
              cd "$project"
              cargo clippy --offline --locked --target ${{ matrix.target }} --all-targets --all-features -- -D clippy::pedantic -D warnings
              cargo test --offline --locked --target ${{ matrix.target }} --workspace
            )
          done
      - name: Build the client
        if: ${{ !startsWith(github.ref_name, 'prepare-v') }}
        working-directory: zxs-client
        run: cargo build --release --offline --locked --target ${{ matrix.target }} -p zxs-cli
      - name: Build the server
        if: matrix.server && !startsWith(github.ref_name, 'client-v') && !startsWith(github.ref_name, 'prepare-v')
        working-directory: zxs-server
        run: cargo build --release --offline --locked --target ${{ matrix.target }}
      - name: Build the disk preparation tool
        if: startsWith(github.ref_name, 'prepare-v') || (matrix.server && !startsWith(github.ref_name, 'client-v'))
        working-directory: tools/zxs-prepare
        run: cargo build --release --offline --locked --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: matrix.target != 'x86_64-pc-windows-msvc' || startsWith(github.ref_name, 'prepare-v')
        with:
          python-version: '3.12'
      - name: Package the desktop client
        if: matrix.target != 'x86_64-pc-windows-msvc' && !startsWith(github.ref_name, 'prepare-v')
        run: python tools/package_release.py ${{ matrix.target }}
      - name: Package the server
        if: matrix.server && !startsWith(github.ref_name, 'client-v') && !startsWith(github.ref_name, 'prepare-v')
        run: python tools/package_release.py ${{ matrix.target }} --server
      - name: Package the standalone disk preparation tool
        if: startsWith(github.ref_name, 'prepare-v')
        run: python tools/package_release.py ${{ matrix.target }} --prepare
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'x86_64-pc-windows-msvc' && !startsWith(github.ref_name, 'prepare-v')
        with:
          dotnet-version: '6.0.x'
      - name: Build the Windows installer
        if: matrix.target == 'x86_64-pc-windows-msvc' && !startsWith(github.ref_name, 'prepare-v')
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP wix
          dotnet tool install --tool-path $wix wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX.' }
          ./tools/package_windows_installer.ps1 -Wix (Join-Path $wix 'wix.exe')
          $installer = Get-Item dist/ZXS-S-Windows-x64.msi
          if ($installer.Length -eq 0) { throw 'The MSI is empty.' }
      - name: Package the unsigned iOS device app
        if: matrix.target == 'aarch64-apple-darwin' && !startsWith(github.ref_name, 'prepare-v')
        run: |
          rustup target add aarch64-apple-ios
          version=$(python -c 'from tools.package_release import version_of; print(version_of("zxs-client"))')
          IFS=. read -r major minor patch <<< "$version"
          build_version="$((major + 1)).$minor.$patch"
          build="$RUNNER_TEMP/zxs-ios-device"
          xcodebuild -project zxs-client/apps/ios/ZXS.xcodeproj -scheme ZXS \
            -configuration Release -destination 'generic/platform=iOS' \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build_version" \
            -derivedDataPath "$build" CODE_SIGNING_ALLOWED=NO build
          app="$build/Build/Products/Release-iphoneos/ZXS.app"
          test "$(xcrun lipo -archs "$app/ZXS")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$build_version"
          payload="$RUNNER_TEMP/zxs-ios-package/Payload"
          mkdir -p "$payload" dist
          ditto "$app" "$payload/ZXS.app"
          ditto -c -k --norsrc --keepParent "$payload" dist/ZXS-S-iOS-arm64-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, verify]
    if: >-
      ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success' &&
      (startsWith(github.ref_name, 'prepare-v') || needs.verify.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and publish the tagged assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == prepare-v* ]]; then
            release_options+=(--latest=false)
            version="${GITHUB_REF_NAME#prepare-v}"
            packages=(
              "zxs-prepare-$version-x86_64-unknown-linux-gnu.tar.gz"
              "zxs-prepare-$version-aarch64-apple-darwin.tar.gz"
              "zxs-prepare-$version-x86_64-pc-windows-msvc.zip"
            )
          else
            version="${GITHUB_REF_NAME#client-}"
            version="${version#v}"
            packages=(
              "zxs-cli-$version-x86_64-unknown-linux-gnu.tar.gz"
              "zxs-cli-$version-aarch64-apple-darwin.tar.gz"
              "ZXS-S-Windows-x64.msi"
              "ZXS-S-Android-arm64.apk"
              "ZXS-S-iOS-arm64-unsigned.ipa"
            )
            if [[ "$GITHUB_REF_NAME" == v* ]]; then
              packages+=("zxs-server-$version-x86_64-unknown-linux-gnu.tar.gz")
            fi
          fi
          for package in "${packages[@]}"; do test -s "$package"; done
          sha256sum "${packages[@]}" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "${release_options[@]}" "${packages[@]}" SHA256SUMS
