name: Build ZXS release assets
on:
  push:
    tags: ["v[0-9]*", "client-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            server: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            server: false
          - os: macos-15
            target: aarch64-apple-darwin
            server: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust for the release target
        run: |
          rustc --version
          rustup target add ${{ matrix.target }}
      - name: Check and build the client
        working-directory: zxs-client
        run: |
          cargo clippy --offline --locked --target ${{ matrix.target }} --all-targets --all-features -- -D clippy::pedantic -D warnings
          cargo test --offline --locked --target ${{ matrix.target }} --workspace
          cargo build --release --offline --locked --target ${{ matrix.target }} -p zxs-cli
      - name: Check and build the server
        if: matrix.server && !startsWith(github.ref_name, 'client-v')
        working-directory: zxs-server
        run: |
          cargo clippy --offline --locked --target ${{ matrix.target }} --all-targets --all-features -- -D clippy::pedantic -D warnings
          cargo test --offline --locked --target ${{ matrix.target }}
          cargo build --release --offline --locked --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          python-version: '3.12'
      - name: Package the desktop client
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: python tools/package_release.py ${{ matrix.target }}
      - name: Package the server
        if: matrix.server && !startsWith(github.ref_name, 'client-v')
        run: python tools/package_release.py ${{ matrix.target }} --server
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'x86_64-pc-windows-msvc'
        with:
          dotnet-version: '6.0.x'
      - name: Build the Windows installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP wix
          dotnet tool install --tool-path $wix wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX.' }
          ./tools/package_windows_installer.ps1 -Wix (Join-Path $wix 'wix.exe')
          $installer = Get-Item dist/ZXS-S-Windows-x64.msi
          if ($installer.Length -eq 0) { throw 'The MSI is empty.' }
      - name: Package the unsigned iOS device app
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add aarch64-apple-ios
          build="$RUNNER_TEMP/zxs-ios-device"
          xcodebuild -project zxs-client/apps/ios/ZXS.xcodeproj -scheme ZXS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$build" CODE_SIGNING_ALLOWED=NO build
          app="$build/Build/Products/Release-iphoneos/ZXS.app"
          test "$(xcrun lipo -archs "$app/ZXS")" = arm64
          payload="$RUNNER_TEMP/zxs-ios-package/Payload"
          mkdir -p "$payload" dist
          ditto "$app" "$payload/ZXS.app"
          ditto -c -k --norsrc --keepParent "$payload" dist/ZXS-S-iOS-arm64-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, verify]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify the complete release
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#client-}"
          version="${version#v}"
          mv app-debug.apk ZXS-S-Android-arm64-debug.apk
          packages=(
            "zxs-cli-$version-x86_64-unknown-linux-gnu.tar.gz"
            "zxs-cli-$version-aarch64-apple-darwin.tar.gz"
            "ZXS-S-Windows-x64.msi"
            "ZXS-S-Android-arm64-debug.apk"
            "ZXS-S-iOS-arm64-unsigned.ipa"
          )
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            packages+=("zxs-server-$version-x86_64-unknown-linux-gnu.tar.gz")
          fi
          for package in "${packages[@]}"; do test -s "$package"; done
          sha256sum "${packages[@]}" > SHA256SUMS
      - name: Publish the tagged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
