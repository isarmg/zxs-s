name: ZXS offline build and smoke test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustc --version
      - name: Verify and build the two independent Cargo projects
        run: python3 tests/run.py --suite rust
      - name: Exercise HTTP, storage, workspace, and mobile ABI behavior
        run: python3 tests/run.py --suite integration --suite desktop --recycle-parent /dev/shm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        working-directory: tests
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps --only-shell chromium
      - name: Test the desktop browser interface
        run: python3 tests/run.py --suite browser

  desktop:
    name: Desktop client on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustc --version
      - name: Verify and build the desktop client
        working-directory: zxs-client
        run: |
          cargo clippy --offline --locked --all-targets --all-features -- -D clippy::pedantic -D warnings
          cargo test --offline --locked --workspace
          cargo build --offline --locked --workspace
      - name: Exercise native desktop workspace behavior on macOS
        if: runner.os == 'macOS'
        run: python3 tests/run.py --suite desktop
      - name: Restore a historical version on Windows
        if: runner.os == 'Windows'
        run: python tests/run.py --suite desktop
      - name: Build the iOS app and File Provider for the simulator
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios-sim
          xcodebuild -project zxs-client/apps/ios/ZXS.xcodeproj -scheme ZXS \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/zxs-ios" CODE_SIGNING_ALLOWED=NO build
          test -f "$RUNNER_TEMP/zxs-ios/Build/Products/Debug-iphonesimulator/ZXS.app/PlugIns/ZXSFileProvider.appex/Info.plist"
      - name: Launch the iOS application on a simulator
        if: runner.os == 'macOS'
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c \
            'import json, sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          trap 'xcrun simctl shutdown "$device"' EXIT
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/zxs-ios/Build/Products/Debug-iphonesimulator/ZXS.app"
          launched=$(xcrun simctl launch "$device" local.zxs.mobile)
          sleep 2
          kill -0 "${launched##*: }"

  android:
    name: Android build and runtime smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Rust for Android
        run: |
          rustc --version
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android SDK components
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Assemble the Android app
        working-directory: zxs-client/apps/android
        run: |
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-android-arm64
          path: zxs-client/apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build the server and emulator APK
        run: |
          (cd zxs-server && cargo build --offline --locked)
          (cd zxs-client/apps/android && gradle --no-daemon -PzxsEmulator :app:assembleDebug)
      - name: Check Android login, upload entry, cached ZIP and reconnection
        timeout-minutes: 10
        run: |
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager --install emulator "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/zxs-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name zxs --package "$image" <<< no
          test -f "$ANDROID_AVD_HOME/zxs.ini"
          sudo chown "$(id -u)" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd zxs -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect -no-metrics > "$RUNNER_TEMP/zxs-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'tail -40 "$RUNNER_TEMP/zxs-emulator.log"; kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed)" = 1 ]; do sleep 2; done
          adb shell input keyevent 82
          python3 tests/run.py --suite android --android-apk zxs-client/apps/android/app/build/outputs/apk/debug/app-debug.apk
