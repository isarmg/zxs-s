[package]
name = "zxs-ffi"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[dependencies]
zxs-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
