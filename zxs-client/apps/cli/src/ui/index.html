<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZXS 文件管理</title>
  <link rel="icon" type="image/png" href="/app-icon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/components.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="mark" src="/app-icon.png" width="24" height="24" alt=""><span>ZXS</span></div>
    <nav aria-label="管理视图">
      <button type="button" data-view="files" data-icon="folder" aria-current="page">文件</button>
      <button type="button" data-view="workspace" data-icon="workspace">工作区</button>
      <button type="button" data-view="recycle" data-icon="trash">回收站</button>
    </nav>
    <div id="transfers" aria-label="文件传输"></div>
    <div class="connection">
      <div class="connection-address"><span class="signal" id="signal" aria-hidden="true"></span><span id="server" class="ellipsis">尚未连接</span></div>
      <button type="button" id="account" class="ghost icon-button" aria-label="连接服务器" title="连接服务器" data-icon="connect"></button>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  </aside>
  <main class="workspace">
    <header class="top">
      <nav id="crumbs" aria-label="当前路径"></nav>
      <button type="button" class="ghost danger" id="purge-all" data-icon="trash" hidden>清空回收站</button>
    </header>
    <div class="toolbar">
      <form id="filters" class="filters" role="search">
        <label class="filter-field" data-icon="search">
          <input id="search" name="q" type="search" placeholder="搜索文件名" aria-label="搜索文件名" aria-keyshortcuts="/" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <label class="filter-field tag-filter">
          <input name="tag" placeholder="标签筛选" aria-label="按标签筛选" autocomplete="off">
        </label>
        <button class="sr-only" type="submit">筛选</button>
      </form>
      <div class="toolbar-actions" id="workspace-tools" hidden>
        <button type="button" class="ghost" id="workspace-location" data-icon="folder">选择工作区</button>
        <button type="button" class="ghost" id="init-bundle" data-icon="bundle" hidden>创建 .zxsignore</button>
        <button type="button" class="ghost primary" id="submit-local" data-icon="upload" hidden><span>提交当前目录</span></button>
      </div>
      <span class="count numeric" id="count" aria-live="polite"></span>
      <div class="toolbar-actions">
        <button type="button" class="ghost icon-button" id="refresh" aria-label="刷新" title="刷新" data-icon="refresh"></button>
        <button type="button" class="ghost" id="sync" data-icon="download" hidden><span>同步</span></button>
        <button type="button" class="ghost" id="edit-tags" data-icon="tag" hidden disabled>添加标签</button>
      </div>
    </div>
    <div class="content">
      <p id="bundle-warning" class="bundle-warning" role="status" hidden></p>
      <div class="table-wrap">
        <table id="table" data-view="files">
          <colgroup id="table-widths"></colgroup>
          <thead id="columns"></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden></div>
      </div>
      <button id="next" class="ghost load-next" type="button" hidden>加载下一页</button>
    </div>
  </main>
  <div class="inspector-backdrop" id="inspector-backdrop" aria-hidden="true" hidden></div>
  <aside id="details" class="details" tabindex="-1" hidden>
    <header class="detail-head">
      <h2>历史版本</h2>
      <button type="button" id="detail-edit-tags" class="ghost icon-button" data-icon="tag" aria-label="添加标签" title="添加标签"></button>
      <button type="button" id="close-detail" class="ghost icon-button" aria-label="关闭详情" title="关闭详情" data-icon="close"></button>
    </header>
    <div id="detail-content"></div>
  </aside>
</div>
<dialog id="form-dialog" aria-labelledby="dialog-title">
  <form id="dialog-form">
    <header class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button type="button" class="ghost icon-button" id="dialog-close" aria-label="关闭对话框" title="关闭对话框" data-icon="close"></button>
    </header>
    <div id="dialog-body"></div>
    <div id="dialog-error" class="inline-error" role="alert" hidden></div>
    <footer class="dialog-footer">
      <button type="button" class="ghost" id="dialog-cancel">取消</button>
      <button id="dialog-submit" class="ghost primary">保存</button>
    </footer>
  </form>
</dialog>
</body>
</html>
