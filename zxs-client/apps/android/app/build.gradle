plugins { id 'com.android.application' }

def rustRoot = rootProject.file('../..')
def rustTarget = layout.buildDirectory.dir('rust-target')
def emulator = providers.gradleProperty('zxsEmulator').isPresent()
def rustArch = emulator ? 'x86_64' : 'aarch64'
def abi = "$rustArch-linux-android"
def ndkRevision = '27.2.12479018'
def rustLibrary = rustTarget.map { it.file("$abi/release/libzxs_ffi.so") }

android {
    namespace 'local.zxs.mobile'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion ndkRevision

    defaultConfig {
        applicationId 'local.zxs.mobile'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters(emulator ? 'x86_64' : 'arm64-v8a') }
        externalNativeBuild {
            cmake {
                arguments '-DZXS_INCLUDE=' + new File(rustRoot, 'crates/ffi/include'),
                          '-DZXS_LIBRARY=' + rustLibrary.get().asFile
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def buildRust = tasks.register('buildRust', Exec) {
    workingDir rustRoot
    inputs.files(new File(rustRoot.parentFile, 'rust-toolchain.toml'))
    inputs.files(fileTree(rustRoot) {
        include 'Cargo.lock', 'Cargo.toml', 'VENDOR.sha256', '.cargo/config.toml', 'crates/**/Cargo.toml', 'crates/**/src/**'
    })
    outputs.file(rustLibrary)
    commandLine 'cargo', 'rustc', '--offline', '--locked', '--release', '-p', 'zxs-ffi', '--target', abi, '--',
                '-C', 'link-arg=-Wl,-soname,libzxs_ffi.so',
                '-C', 'link-arg=-Wl,-z,max-page-size=16384',
                '-C', 'link-arg=-Wl,-z,common-page-size=16384'
    doFirst {
        def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        def platform = os.contains('mac') ? 'darwin-x86_64' : (os.contains('win') ? 'windows-x86_64' : 'linux-x86_64')
        def sdk = androidComponents.sdkComponents.sdkDirectory.get().asFile
        def tools = new File(sdk, "ndk/$ndkRevision/toolchains/llvm/prebuilt/$platform/bin")
        def clang = new File(tools, "$abi" + '33-clang' + (os.contains('win') ? '.cmd' : ''))
        def targetKey = abi.replace('-', '_')
        environment 'CARGO_TARGET_DIR', rustTarget.get().asFile
        environment "CC_$targetKey", clang.absolutePath
        environment "AR_$targetKey", new File(tools, os.contains('win') ? 'llvm-ar.exe' : 'llvm-ar').absolutePath
        environment "CARGO_TARGET_${targetKey.toUpperCase(Locale.ROOT)}_LINKER", clang.absolutePath
    }
}

tasks.configureEach {
    if (name == 'preBuild' || name.startsWith('configureCMake') || name.startsWith('buildCMake')) {
        dependsOn buildRust
    }
}
