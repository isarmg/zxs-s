[workspace]
members = ["crates/core", "crates/ffi", "apps/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
version = "0.1.9"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
